<style>
body { padding: 8px; }
.drafts { max-width: 720px; margin: 0 auto; }
.draft { border: 3px double #1d1a16; padding: 12px; margin: 0 0 18px; }
.draft h2 { margin-bottom: 6px; }
.draft .row { display: flex; flex-wrap: wrap; align-items: flex-end; }
.draft .cell { margin: 6px 14px 6px 0; text-align: center; font-size: 0.8em; }
.draft .big { width: 100%; max-width: 520px; height: auto; display: block; }
.draft .small { height: 48px; width: auto; display: block; margin: 0 auto 4px; }
.draft .icon { width: 120px; height: 120px; display: block; margin: 0 auto 4px; }
.draft .icon48 { width: 48px; height: 48px; display: block; margin: 0 auto 4px; }
